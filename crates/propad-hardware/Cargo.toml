[package]
name = "propad-hardware"
version = "3.0.0"
edition = "2021"

[dependencies]
propad-core = { path = "../propad-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Bluetooth", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security", "Win32_UI_Input_XboxController"] }
