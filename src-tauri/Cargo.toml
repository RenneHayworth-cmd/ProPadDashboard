[package]
name = "propad-dashboard"
version = "3.0.0"
edition = "2021"
description = "离线手柄电量与实时输入悬浮看板"
license = "MIT"

[[bin]]
name = "ProPadDashboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
propad-core = { path = "../crates/propad-core" }
propad-hardware = { path = "../crates/propad-hardware" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Power"] }
